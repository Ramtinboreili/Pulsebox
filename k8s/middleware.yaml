# Traefik middlewares that let the prefix-unaware Pulsebox pod serve cleanly
# under Host(`cluster.datatejarat.ir`)/pulsebox. See ingressroute.yaml for how
# they are chained (add-slash first, then strip-prefix).
---
# Redirect the bare `/pulsebox` (no trailing slash) to `/pulsebox/`. Without
# this, a browser at .../pulsebox resolves the relative `style.css`/`app.js`/
# `api/…` URLs against the host root and they 404. The regex anchors on `$` so
# it fires ONLY for the exact prefix, never for `/pulsebox/…` sub-paths.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pulsebox-add-slash
  namespace: pulsebox
  labels:
    app.kubernetes.io/name: pulsebox
spec:
  redirectRegex:
    regex: "^(https?://[^/]+/pulsebox)$"
    replacement: "${1}/"
    permanent: false
---
# Strip `/pulsebox` so the pod (which serves at `/` and `/api/…`) sees the paths
# it expects. Runs after add-slash, so it only ever sees `/pulsebox/…` requests.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pulsebox-strip-prefix
  namespace: pulsebox
  labels:
    app.kubernetes.io/name: pulsebox
spec:
  stripPrefix:
    prefixes:
      - /pulsebox
