{{- if .Values.ingressRoute.enabled -}}
# Traefik v3 IngressRoute exposes only the dashboard/API (http) port.
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "pulsebox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsebox.labels" . | nindent 4 }}
spec:
  entryPoints:
    - {{ .Values.ingressRoute.entryPoint }}
  routes:
    - kind: Rule
      match: Host(`{{ .Values.ingressRoute.host }}`)
      services:
        - name: {{ include "pulsebox.fullname" . }}
          port: {{ .Values.ports.http }}
  {{- with .Values.ingressRoute.tls }}
  tls:
    secretName: {{ .secretName }}
  {{- end }}
{{- end }}
