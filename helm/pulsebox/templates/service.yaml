apiVersion: v1
kind: Service
metadata:
  name: {{ include "pulsebox.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pulsebox.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pulsebox.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.ports.metrics }}
      targetPort: metrics
    - name: http
      port: {{ .Values.ports.http }}
      targetPort: http
