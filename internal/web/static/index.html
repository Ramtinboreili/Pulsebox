<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulsebox — Cluster Health</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header id="topbar">
    <div class="brand">
      <span class="logo">◉</span>
      <span class="title">Pulsebox</span>
    </div>
    <div id="summary" class="summary"></div>
    <div class="controls">
      <input id="search" type="search" placeholder="Search…" autocomplete="off" />
      <div class="ns-multi" id="nsMulti">
        <button class="btn ns-btn" id="nsBtn" title="Filter by namespace" aria-haspopup="true" aria-expanded="false">
          <span id="nsBtnLabel">All namespaces</span><span class="caret">▾</span>
        </button>
        <div class="ns-menu hidden" id="nsMenu">
          <input class="ns-search" id="nsMenuSearch" type="search" placeholder="Filter namespaces…" autocomplete="off" />
          <div class="ns-menu-actions"><button type="button" id="nsClear">Clear (show all)</button></div>
          <div class="ns-list" id="nsList"></div>
        </div>
      </div>
      <button id="fit" class="btn" title="Fit to view">⤢</button>
      <span id="connState" class="conn conn-connecting">connecting…</span>
    </div>
  </header>

  <main class="stage">
    <canvas id="graph"></canvas>

    <div id="overlay" class="overlay">
      <div class="spinner"></div>
      <div id="overlayText">Loading cluster topology…</div>
    </div>

    <aside id="detail" class="detail hidden">
      <button id="detailClose" class="close" aria-label="close">×</button>
      <div id="detailAccent" class="detail-accent"></div>
      <div id="detailBody"></div>
    </aside>

    <div id="tooltip" class="tooltip hidden"></div>

    <div class="legend" id="legend">
      <span><i class="dot healthy"></i>healthy</span>
      <span><i class="dot degraded"></i>degraded</span>
      <span><i class="dot unhealthy"></i>unhealthy</span>
      <span><i class="dot unknown"></i>unknown</span>
      <span><i class="chip-gpu">GPU</i> GPU node</span>
      <span class="hint">drag to pan · scroll to zoom · click for detail</span>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
